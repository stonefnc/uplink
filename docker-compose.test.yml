# Local test mailbox for the email intake workflow. Not for production.
# Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
services:
  mail:
    image: greenmail/standalone:2.1.15
    container_name: uplink-mail
    restart: "no"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=helpdesk:uplink-test@example.org
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
